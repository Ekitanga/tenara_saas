services:
  - type: web
    name: tenara-staging
    runtime: docker
    repo: https://github.com/Ekitanga/tenara_saas
    branch: simplify-core-product
    region: frankfurt
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz/
    autoDeployTrigger: commit
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: CORE_PRODUCT_MODE
        value: "True"
      - key: ENABLE_SUBSCRIPTIONS
        value: "False"
      - key: ENABLE_REMINDERS
        value: "False"
      - key: ENABLE_MPESA
        value: "False"
      - key: ENABLE_SMS
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: tenara-staging-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: tenara-staging-redis
          type: keyvalue
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: tenara-staging-redis
          type: keyvalue
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: tenara-staging-redis
          type: keyvalue
          property: connectionString
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
