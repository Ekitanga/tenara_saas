services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tenara_db
      POSTGRES_USER: tenara
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes: [staging_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U tenara -d tenara_db"]
  redis:
    image: redis:7-alpine
  web:
    build: .
    env_file: .env.staging
    environment:
      DB_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db: {condition: service_healthy}
    ports: ["8000:8000"]
volumes:
  staging_pgdata:
